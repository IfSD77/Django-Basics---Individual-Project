<div class="col-md-4 mb-4">
    <div class="card h-100 shadow-sm">
        {% if project.image %}
            <img src="{{ project.image.url }}"
                 class="card-img-top"
                 alt="{{ project.name }}"
                 style="height: 200px; object-fit: cover;">
        {% else %}
            <div class="card-img-top bg-light d-flex align-items-center justify-content-center"
                 style="height: 200px;">
                <span class="text-muted">No Image</span>
            </div>
        {% endif %}

        <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ project.name }}</h5>
            <p class="card-text">
                <strong>Built in:</strong> {{ project.built_in|default:"N/A" }}<br>
                <strong>Location:</strong> {{ project.location }}, {{ project.postcode }}<br>
                <strong>Value:</strong> {{ project.get_contract_value_short }}
            </p>
            <div class="mt-auto">
                <a href="{% url 'project_detail' project.slug %}" class="btn btn-primary w-100">
                    View Details
                </a>
            </div>
        </div>
    </div>
</div>
